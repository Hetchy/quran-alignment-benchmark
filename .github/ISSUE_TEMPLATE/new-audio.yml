name: Suggest new audio
description: Suggest a useful recording for a future corpus version.
title: "Audio suggestion: "
body:
  - type: markdown
    attributes:
      value: "Only the recording, reciter name, and why it would help are needed. No annotations or other metadata are required. If accepted, we will ingest and annotate it for the next corpus version."
  - type: textarea
    id: audio
    attributes:
      label: Audio link or file
      description: Link to the recording, or attach the audio file here.
    validations:
      required: true
  - type: input
    id: reciter
    attributes:
      label: Reciter name
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this a useful addition?
      description: Briefly explain what this recording adds to the corpus.
    validations:
      required: true
